<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#0f1218"/>

<text x="40" y="52" font-size="25" font-weight="600" fill="#e8eaed">Where the latent nodes work: inside the sampling loop</text>
<text x="40" y="80" font-size="16" fill="#a0a7b4">At every model call inside the window, the prediction of the finished picture is nudged before the sampler steps on it.</text>
<rect x="30" y="200" width="150" height="110" rx="12" fill="#181b23" stroke="#3a4150" stroke-width="1.5"/>
<text x="105.0" y="232" text-anchor="middle" font-size="19" font-weight="600" fill="#e8eaed">Start</text>
<text x="105.0" y="258" text-anchor="middle" font-size="15" fill="#a0a7b4">your picture</text>
<text x="105.0" y="279" text-anchor="middle" font-size="15" fill="#a0a7b4">(img2img)</text>
<text x="105.0" y="300" text-anchor="middle" font-size="15" fill="#a0a7b4">or noise</text>
<line x1="180" y1="255" x2="236" y2="255" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
<rect x="240" y="112" width="660" height="330" rx="16" fill="none" stroke="#3a4150" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="262" y="140" font-size="15" font-weight="600" fill="#8a93a3" letter-spacing="1.5">SAMPLING · EVERY MODEL CALL</text>
<rect x="262" y="165" width="180" height="140" rx="12" fill="#181b23" stroke="#3a4150" stroke-width="1.5"/>
<text x="352.0" y="197" text-anchor="middle" font-size="19" font-weight="600" fill="#e8eaed">Model</text>
<text x="352.0" y="223" text-anchor="middle" font-size="15" fill="#a0a7b4">predicts the</text>
<text x="352.0" y="244" text-anchor="middle" font-size="15" fill="#a0a7b4">finished picture</text>
<line x1="442" y1="235" x2="478" y2="235" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
<rect x="480" y="165" width="230" height="140" rx="12" fill="#181b23" stroke="url(#g)" stroke-width="3"/>
<text x="595.0" y="197" text-anchor="middle" font-size="19" font-weight="600" fill="#ffb347">Color Grade</text>
<text x="595.0" y="223" text-anchor="middle" font-size="15" fill="#a0a7b4">reads its colour through</text>
<text x="595.0" y="244" text-anchor="middle" font-size="15" fill="#a0a7b4">the decoder's colour axes,</text>
<text x="595.0" y="265" text-anchor="middle" font-size="15" fill="#a0a7b4">moves it toward the target</text>
<line x1="710" y1="235" x2="746" y2="235" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
<rect x="748" y="165" width="132" height="140" rx="12" fill="#181b23" stroke="#3a4150" stroke-width="1.5"/>
<text x="814.0" y="197" text-anchor="middle" font-size="19" font-weight="600" fill="#e8eaed">Sampler</text>
<text x="814.0" y="223" text-anchor="middle" font-size="15" fill="#a0a7b4">steps from the</text>
<text x="814.0" y="244" text-anchor="middle" font-size="15" fill="#a0a7b4">corrected</text>
<text x="814.0" y="265" text-anchor="middle" font-size="15" fill="#a0a7b4">prediction</text>
<path d="M814,305 C814,352 352,352 352,312" fill="none" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
<text x="712" y="362" text-anchor="middle" font-size="15" fill="#a0a7b4">next step</text>
<rect x="262" y="392" width="618" height="10" rx="5" fill="#262b36"/>
<rect x="633" y="392" width="247" height="10" rx="5" fill="url(#g)"/>
<text x="262" y="426" font-size="14" fill="#8a93a3">schedule 0 %</text>
<text x="880" y="426" text-anchor="end" font-size="14" fill="#8a93a3">100 %</text>
<text x="756" y="384" text-anchor="middle" font-size="14" fill="#ffb347">the window: start_percent → end_percent</text>
<line x1="900" y1="235" x2="936" y2="235" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
<rect x="938" y="180" width="112" height="110" rx="12" fill="#181b23" stroke="#3a4150" stroke-width="1.5"/>
<text x="994.0" y="212" text-anchor="middle" font-size="19" font-weight="600" fill="#e8eaed">VAE</text>
<text x="994.0" y="238" text-anchor="middle" font-size="15" fill="#a0a7b4">decode</text>
<line x1="1050" y1="235" x2="1076" y2="235" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
<rect x="1078" y="180" width="96" height="110" rx="12" fill="#181b23" stroke="#3a4150" stroke-width="1.5"/>
<text x="1126.0" y="212" text-anchor="middle" font-size="19" font-weight="600" fill="#e8eaed">Picture</text>
<text x="1126.0" y="238" text-anchor="middle" font-size="15" fill="#a0a7b4">in the</text>
<text x="1126.0" y="259" text-anchor="middle" font-size="15" fill="#a0a7b4">palette</text>
<text x="40" y="482" font-size="15" font-weight="600" fill="#8a93a3" letter-spacing="1.5">THE TARGET COMES FROM</text>
<rect x="40" y="540" width="360" height="66" rx="10" fill="#181b23" stroke="#3a4150"/>
<text x="58" y="568" font-size="17" font-weight="600" fill="#e8eaed">Grade Wheels (latent)</text>
<text x="58" y="592" font-size="15" fill="#a0a7b4">lift · gamma · gain · saturation</text>
<line x1="220" y1="540" x2="220" y2="508" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="420" y="540" width="360" height="66" rx="10" fill="#181b23" stroke="#3a4150"/>
<text x="438" y="568" font-size="17" font-weight="600" fill="#e8eaed">Latent Color Guidance</text>
<text x="438" y="592" font-size="15" fill="#a0a7b4">a reference picture's palette</text>
<line x1="600" y1="540" x2="600" y2="508" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="800" y="540" width="360" height="66" rx="10" fill="#181b23" stroke="#3a4150"/>
<text x="818" y="568" font-size="17" font-weight="600" fill="#e8eaed">Grade Wheels + anchor</text>
<text x="818" y="592" font-size="15" fill="#a0a7b4">a frame's levels, then your wheels</text>
<line x1="980" y1="540" x2="980" y2="508" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="220" y1="508" x2="980" y2="508" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="560" y1="508" x2="560" y2="309" stroke="#8a93a3" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
</svg>
